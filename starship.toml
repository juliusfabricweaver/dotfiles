"$schema" = "https://starship.rs/config-schema.json"

palette = "gruvbox"

format = """
[╭─](gray) $username$hostname$directory$git_branch$git_state$git_status$all\
[╰─](gray) $character"""

right_format = "$cmd_duration$status"

[palettes.gruvbox]
gray = "#665c54"
dim = "#928374"
fg = "#ebdbb2"
red = "#fb4934"
yellow = "#fabd2f"
aqua = "#8ec07c"
orange = "#fe8019"

# Only shown over ssh or as root
[username]
format = "[$user]($style)[@](dim)"
style_user = "orange"
style_root = "bold red"

[hostname]
format = "[$hostname]($style) [in](dim) "
style = "orange"

[directory]
style = "bold yellow"
read_only = " ro"
read_only_style = "red"
truncate_to_repo = true
truncation_length = 0

[git_branch]
format = "[on](dim) [$branch]($style) "
style = "aqua"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
deleted = "x"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "orange"

[sudo]
disabled = false
format = "[sudo]($style) "
style = "orange"

[cmd_duration]
min_time = 1
format = "[$duration]($style)"
style = "dim"

[status]
disabled = false
format = " [$status]($style)"
style = "red"

[character]
success_symbol = "[λ](yellow)"
error_symbol = "[λ](red)"
vimcmd_symbol = "[λ](aqua)"

# Toolchains: quiet, one colour, no icons
[nodejs]
format = "[node $version]($style) "
style = "dim"

[php]
format = "[php $version]($style) "
style = "dim"

[python]
format = "[py $version( $virtualenv)]($style) "
style = "dim"

[rust]
format = "[rs $version]($style) "
style = "dim"

[golang]
format = "[go $version]($style) "
style = "dim"

[java]
format = "[java $version]($style) "
style = "dim"

[ruby]
format = "[rb $version]($style) "
style = "dim"

[swift]
format = "[swift $version]($style) "
style = "dim"

[lua]
format = "[lua $version]($style) "
style = "dim"

[docker_context]
format = "[docker $context]($style) "
style = "dim"

[aws]
format = "[aws $profile( $region)]($style) "
style = "dim"

[conda]
format = "[conda $environment]($style) "
style = "dim"

[package]
disabled = true
